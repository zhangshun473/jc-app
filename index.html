<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e62129">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="竞彩助手">
<title>竞彩助手</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<style>
:root{--red:#e62129;--orange:#f08a1c;--orange-soft:#fff4e8;--bg:#f4f5f7;--card:#fff;--t1:#16181d;--t2:#6b7280;--t3:#9aa2ad;--line:#eef0f3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#d9dce1;color:var(--t1);display:flex;justify-content:center;align-items:center}
.phone{width:100%;max-width:420px;height:100dvh;max-height:880px;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden;overflow:clip;box-shadow:0 12px 48px rgba(0,0,0,.22);border-radius:18px}
@media (max-width:420px){.phone{max-height:none;border-radius:0}}
.app-header{flex:0 0 auto;background:var(--red);color:#fff;padding:10px 12px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.home-tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.home-tabs::-webkit-scrollbar{display:none}
.home-tab{flex:0 0 auto;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:13px;padding:7px 13px;border-radius:999px;font-family:inherit;cursor:pointer;white-space:nowrap}
.home-tab.on{background:#fff;color:var(--red);font-weight:700}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.hd-title{font-size:17px;font-weight:700}
.hd-title.left{margin-right:auto}
.hd-meta{font-size:11px;opacity:.82}
.hd-btn{width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.seg{margin-top:10px;display:flex;background:rgba(0,0,0,.16);border-radius:999px;padding:3px}
.seg-item{flex:1;border:0;background:none;color:#fff;font-size:13px;padding:6px 0;border-radius:999px;font-family:inherit;cursor:pointer}
.seg-item.on{background:#fff;color:var(--red);font-weight:700}
.status-bar{flex:0 0 auto;display:flex;align-items:center;gap:6px;font-size:10px;color:#8a93a0;background:#eef0f3;padding:5px 12px;min-height:24px;border-bottom:1px solid #e6e9ed}
.dot{width:6px;height:6px;border-radius:50%;background:#9aa2ad}
.dot.live{background:#1a9e52}
.dot.partial{background:var(--orange)}
.spin{width:9px;height:9px;border:1.5px solid #c9ced6;border-top-color:var(--red);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-bar .retry{margin-left:auto;color:var(--red);font-weight:700;cursor:pointer;padding:3px 6px;border-radius:4px}
.app-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:34px}
.card{background:var(--card);border-radius:12px;margin:10px 12px;padding:12px}
.pool-card{margin:10px 12px;border-radius:14px;padding:14px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#ff5257 0%,#e62129 52%,#b9121a 100%);box-shadow:0 8px 20px rgba(230,33,41,.28)}
.pool-top{display:flex;justify-content:space-between;align-items:flex-start}
.pool-label{font-size:12px;opacity:.9}
.pool-num{font-size:26px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.pool-tag{background:#ffe9a8;color:#a1651a;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;animation:blink 1.7s infinite;white-space:nowrap}
@keyframes blink{50%{opacity:.45}}
.pool-sub{font-size:11px;opacity:.88;margin-top:6px}
.pool-actions{display:flex;gap:8px;margin-top:12px}
.pool-btn{flex:1;border:0;border-radius:999px;padding:9px 0;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.pool-btn.ghost{background:rgba(255,255,255,.22);color:#fff}
.pool-btn.solid{background:#fff;color:var(--red)}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-head b{font-size:14px;font-weight:800}
.sec-more{font-size:11px;color:var(--t3);cursor:pointer;padding:2px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.entry{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-family:inherit;cursor:pointer;padding:6px 0;border-radius:10px}
.entry:active{background:#f6f7f9}
.entry-ico{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.entry-name{font-size:11px;color:var(--t2)}
.match-row{padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.match-row:last-child{border-bottom:0;padding-bottom:2px}
.mr-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t3);margin-bottom:9px}
.mr-league{color:var(--red);font-weight:700}
.mr-status{margin-left:auto}
.mr-status.live{color:var(--red);font-weight:700}
.mr-main{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mr-team{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex:1;min-width:0}
.mr-team.right{justify-content:flex-end}
.mr-team .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr-score{font-size:15px;font-weight:800;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.mr-score.live{color:var(--red)}
.mr-odds{display:flex;gap:6px;margin-top:9px}
.odd{flex:1;border:1px solid var(--line);background:#fafbfc;border-radius:8px;padding:6px 0;font-size:11px;font-family:inherit;cursor:pointer;color:var(--t3);display:flex;flex-direction:column;align-items:center;gap:1px}
.odd b{font-size:13px;color:var(--t1);font-variant-numeric:tabular-nums}
.odd.on{background:#fff0f0;border-color:var(--red)}
.odd.on b{color:var(--red)}
.badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex:0 0 auto}
.badge.lg{width:34px;height:34px;font-size:14px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--t2);font-size:12px;padding:6px 13px;border-radius:999px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px 4px}
.mgrid{background:#fff;border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.mgrid-top{display:flex;justify-content:space-between;font-size:10px;color:var(--t3)}
.mgrid-league{color:var(--red);font-weight:700}
.mgrid-team{display:flex;align-items:center;gap:6px;font-size:12px}
.mgrid-team .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mgrid-score{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.mgrid-score.live{color:var(--red)}
.region-wrap{display:flex;gap:8px;margin:0 12px;background:#fff;border-radius:12px;padding:10px;min-height:200px}
.region-menu{width:62px;flex:0 0 auto;display:flex;flex-direction:column;gap:5px}
.region-item{border:0;background:#f5f6f8;border-radius:8px;padding:9px 0;font-size:11px;color:var(--t2);font-family:inherit;cursor:pointer}
.region-item.on{background:#ffe9ea;color:var(--red);font-weight:800}
.region-icons{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px;align-content:start}
.licon{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:none;padding:3px 0;cursor:pointer;font-family:inherit;border-radius:8px}
.licon-circle{width:36px;height:36px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.13)}
.licon-name{font-size:10px;color:var(--t2);text-align:center;line-height:1.2}
.detail-bar{margin:10px 12px 0;background:#fff;border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:8px}
.detail-bar .db-title{font-size:13px;font-weight:800}
.detail-bar .db-sub{font-size:11px;color:var(--t3);margin-left:auto}
.date-row{padding-top:4px}
.date-chip{flex:0 0 auto;background:#fff;border-radius:10px;padding:7px 11px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;cursor:pointer}
.date-chip .dw{font-size:11px;color:var(--t2)}
.date-chip .dm{font-size:10px;color:var(--t3);font-variant-numeric:tabular-nums}
.date-chip.on{background:var(--red);border-color:var(--red)}
.date-chip.on .dw,.date-chip.on .dm{color:#fff;font-weight:700}
.dcard{background:#fff;border-radius:12px;margin:0 12px 9px;padding:12px;cursor:pointer}
.dcard-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--t3);margin-bottom:12px}
.dcard-top .dcard-status{margin-left:auto}
.dcard-top .dcard-status.live{color:var(--red);font-weight:700}
.dcard-main{display:flex;align-items:center;justify-content:space-between;gap:6px}
.team-col{display:flex;flex-direction:column;align-items:center;gap:7px;width:88px;font-size:12px;font-weight:600;text-align:center;line-height:1.2}
.vs{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.vs.live{color:var(--red)}
.dcard-tags{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.ptag{font-size:10px;background:#ffe9ea;color:var(--red);padding:3px 8px;border-radius:5px;font-weight:700}
.ptag.blue{background:#e8f1ff;color:#2a6bd8}
.ptag.gray{background:#f2f4f6;color:var(--t3)}
.dcard-btn{margin-left:auto;border:1px solid #ffd0d2;background:#fff;color:var(--red);font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;font-family:inherit;cursor:pointer}
.md-head{background:#fff;border-radius:12px;margin:10px 12px;padding:16px 12px}
.md-league{text-align:center;font-size:11px;color:#9aa2ad;margin-bottom:14px}
.md-league span{color:var(--red);font-weight:700}
.md-vs{display:flex;align-items:center;justify-content:space-between;gap:8px}
.md-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:700;text-align:center}
.md-score{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;min-width:88px;text-align:center}
.md-score.live{color:var(--red)}
.md-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 2px;scrollbar-width:none}
.md-tabs::-webkit-scrollbar{display:none}
.md-tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 15px;font-size:12px;color:var(--t2);font-family:inherit;cursor:pointer}
.md-tab.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.odds-table{width:100%;border-collapse:collapse;font-size:11px}
.odds-table th{color:#9aa2ad;font-weight:500;text-align:center;padding:8px 2px;border-bottom:1px solid #eef0f3}
.odds-table td{text-align:center;padding:9px 2px;border-bottom:1px solid #f5f6f8;font-variant-numeric:tabular-nums}
.odds-table td:first-child{text-align:left;padding-left:4px;color:#6b7280}
.odds-table tr:last-child td{border-bottom:0}
.odds-up{color:#e62129}
.odds-down{color:#1a9e52}
.line-wrap{display:flex;gap:8px}
.line-box{flex:1;background:#f7f8fa;border-radius:10px;padding:14px;text-align:center}
.line-label{font-size:10px;color:#9aa2ad}
.line-val{font-size:18px;font-weight:800;margin:8px 0}
.line-odds{display:flex;gap:8px;font-size:12px}
.line-odds span{flex:1;background:#fff;border-radius:8px;padding:7px 0}
.line-odds .h{color:var(--red);font-weight:700}
.line-odds .a{color:#2a6bd8;font-weight:700}
.h2h-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f5f6f8;font-size:11px}
.h2h-row:last-child{border-bottom:0}
.h2h-date{width:62px;color:#9aa2ad;flex:0 0 auto;font-variant-numeric:tabular-nums}
.h2h-team{flex:1;text-align:right;color:#16181d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h2h-score{width:56px;text-align:center;font-weight:800;flex:0 0 auto;font-variant-numeric:tabular-nums}
.h2h-team.a{text-align:left}
.form-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px}
.form-row:last-child{margin-bottom:0}
.form-name{width:96px;flex:0 0 auto;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-badges{display:flex;gap:5px}
.fb{width:21px;height:21px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.fb.w{background:#1a9e52}.fb.d{background:#9aa2ad}.fb.l{background:#e62129}
.draw-banner{margin:10px 12px;background:linear-gradient(135deg,#fff0f0,#ffe4e5);border-radius:12px;padding:12px 14px;display:flex;align-items:center}
.db-t{font-size:14px;font-weight:800;color:var(--red)}
.db-s{font-size:11px;color:#b06a6d;margin-top:3px}
.db-tag{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:4px 10px;border-radius:6px}
.draw-card{background:#fff;border-radius:12px;margin:0 12px 9px;padding:13px}
.draw-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:8px}
.draw-name{font-size:14px;font-weight:800;flex:0 0 auto}
.draw-period{font-size:11px;color:var(--t3);text-align:right}
.draw-result{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ball{width:27px;height:27px;border-radius:50%;background:#ffe9ea;color:var(--red);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ball.wide{width:auto;min-width:27px;padding:0 7px;border-radius:14px}
.ai-line{display:flex;gap:6px;flex-wrap:wrap;padding:2px 12px 8px}
.ai-chip{font-size:11px;color:var(--red);background:#ffe9ea;border-radius:999px;padding:3px 9px;font-weight:700}
.lv-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 12px 8px;font-size:11px;color:var(--t3)}
.lv-min{color:var(--red);font-weight:700}
.lv-half{color:var(--t2)}
.draw-actions{display:flex;gap:8px}
.btn-soft{flex:1;border:0;background:var(--orange-soft);color:var(--orange);font-size:12px;font-weight:700;padding:9px 0;border-radius:9px;font-family:inherit;cursor:pointer}
.draw-hist-btn{display:block;width:100%;border:0;background:#f7f8fa;color:#6b7280;font-size:11px;padding:8px 0;border-radius:8px;margin-top:10px;font-family:inherit;cursor:pointer}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #f5f6f8;font-size:10px}
.hist-period{width:68px;color:#9aa2ad;flex:0 0 auto;font-variant-numeric:tabular-nums}
.hist-balls{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.hist-ball{background:#f2f4f6;color:#5b6472;border-radius:4px;padding:2px 6px;font-weight:700;font-size:10px}
.hist-empty{text-align:center;color:#9aa2ad;font-size:11px;padding:14px 0}
.trend-wrap{margin:0 12px;background:#fff;border-radius:12px;padding:10px;overflow:hidden}
.trend-scroll{overflow-x:auto}
.trend-table{border-collapse:collapse;font-size:11px;white-space:nowrap}
.trend-table th,.trend-table td{padding:6px 7px;text-align:center}
.trend-table thead th{color:#9aa2ad;font-weight:600;font-size:10px;padding-top:2px}
.trend-table .th-fixed{position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 #eef0f3;text-align:left}
.trend-table .td-fixed{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 #eef0f3;color:#6b7280;text-align:left;font-weight:600}
.tv{display:inline-block;min-width:22px;padding:3px 5px;border-radius:5px;font-weight:800;font-size:11px}
.tv-win{background:#ffe9ea;color:#e62129}
.tv-draw{background:#eef0f3;color:#5b6472}
.tv-lose{background:#e8f1ff;color:#2a6bd8}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:11px}
.stat-k{width:38px;font-weight:800;color:#e62129;text-align:center;flex:0 0 auto}
.stat-bar{flex:1;height:8px;background:#f2f4f6;border-radius:999px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7b7f,#e62129);border-radius:999px}
.stat-v{width:88px;text-align:right;color:#9aa2ad;font-variant-numeric:tabular-nums;flex:0 0 auto}
.pay-banner{margin:10px 12px;background:linear-gradient(135deg,#fff0f0,#ffe4e5);border-radius:12px;padding:16px 14px;position:relative}
.pb-label{font-size:11px;color:#b06a6d}
.pb-num{font-size:28px;font-weight:800;color:#e62129;margin-top:6px;font-variant-numeric:tabular-nums}
.pb-hint{font-size:10px;color:#b06a6d;margin-top:8px}
.amount-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.amount-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px 0;font-size:15px;font-weight:800;color:var(--t1);font-family:inherit;cursor:pointer;position:relative}
.amount-btn.on{background:#fff0f0;border-color:var(--red);color:var(--red)}
.custom-amount{margin-top:10px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafbfc}
.custom-amount .cur{font-size:15px;font-weight:800}
.custom-amount input{flex:1;border:0;background:none;font-size:15px;font-family:inherit;outline:none;color:var(--t1);font-weight:700;min-width:0}
.code-btn{border:0;background:#fff0f0;color:var(--red);font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px;font-family:inherit;cursor:pointer;white-space:nowrap}
.code-btn:disabled{background:#f2f4f6;color:#9aa2ad}
.pay-method{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid #f5f6f8;cursor:pointer}
.pay-method:last-child{border-bottom:0}
.pay-logo{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;flex:0 0 auto}
.pm-name{flex:1;font-size:13px;font-weight:700}
.pm-desc{font-size:10px;color:#9aa2ad;margin-top:3px;font-weight:400}
.pm-radio{width:20px;height:20px;border-radius:50%;border:2px solid #d6dae0;flex:0 0 auto;position:relative}
.pay-method.on .pm-radio{border-color:var(--red)}
.pay-method.on .pm-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--red)}
.pay-btn{width:100%;border:0;background:linear-gradient(135deg,#ff5257,#e62129);color:#fff;font-size:15px;font-weight:800;padding:14px 0;border-radius:12px;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(230,33,41,.3);margin-top:10px}
.pay-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.wallet-row{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid #f5f6f8;font-size:12px}
.wallet-row:last-child{border-bottom:0}
.wr-info{flex:1;min-width:0}
.wr-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-time{font-size:10px;color:#9aa2ad;margin-top:3px}
.wr-amount{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
.wr-amount.in{color:#1a9e52}
.wr-amount.out{color:#e62129}
.login-screen{position:absolute;inset:0;background:var(--red);display:none;flex-direction:column;z-index:100;overflow:hidden}
.login-screen.show{display:flex}
.login-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.login-bg::before,.login-bg::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.login-bg::before{width:280px;height:280px;top:-120px;right:-90px}

function mockMatchDetail(m){const rnd=prng(hashStr(String(m.id)+m.home.n+m.away.n));const isBasket=!m.odds.some(o=>o.k==='平');let base={h:1.95,d:3.40,a:3.70};if(!isBasket){const h=m.odds.find(o=>o.k==='主胜');const d=m.odds.find(o=>o.k==='平');const a=m.odds.find(o=>o.k==='客胜');if(h&&isFinite(+h.v))base.h=+h.v;if(d&&isFinite(+d.v))base.d=+d.v;if(a&&isFinite(+a.v))base.a=+a.v}else{base={h:1.85,a:1.95}}const jit=(v,amp)=>Math.max(1.01,v*(1+(rnd()-0.5)*(amp||0.16)));const books=['威廉希尔','bet365','澳门','立博'].map(name=>{const init=isBasket?{h:jit(base.h),a:jit(base.a)}:{h:jit(base.h),d:jit(base.d),a:jit(base.a)};const now=isBasket?{h:jit(init.h,0.1),a:jit(init.a,0.1)}:{h:jit(init.h,0.1),d:jit(init.d,0.1),a:jit(init.a,0.1)};return{name,init,now}});const lines=['平手','平/半','半球','半/一','一球','球半'];const ah={line:isBasket?(rnd()*12-6).toFixed(1):lines[Math.floor(rnd()*lines.length)],home:(0.85+rnd()*0.25).toFixed(3),away:(0.85+rnd()*0.25).toFixed(3)};const ou={line:isBasket?(200+Math.floor(rnd()*30))+'.5':'2.5',over:(0.85+rnd()*0.25).toFixed(3),under:(0.85+rnd()*0.25).toFixed(3)};const h2h=Array.from({length:6},(_,i)=>{const hs=Math.floor(rnd()*(isBasket?12:4));const as=Math.floor(rnd()*(isBasket?12:4));const d=new Date(Date.now()-(i+1)*(10+rnd()*25)*86400000);return{date:d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()),home:m.home.n,away:m.away.n,hs,as}});const pickForm=()=>{const r=rnd();return r<0.5?'W':r<0.75?'D':'L'};const form={home:Array.from({length:5},pickForm),away:Array.from({length:5},pickForm)};return{base:m,isBasket,books,ah,ou,h2h,form,mock:true}}

te.region===r?'on':'')+'" onclick="setRegion(\''+r+'\')">'+r+'</button>').join('')+'</div><div class="region-icons">'+regionLeagues.map(l=>'<button class="licon" onclick="openLeague(\''+l.name+'\')"><span class="licon-circle" style="background:'+l.c+'">'+l.short+'</span><span class="licon-name">'+l.name+'</span></button>').join('')+'</div></div>'}

function detailCard(m){const live=String(m.status).indexOf('进行中')>-1;return '<div class="dcard" onclick="openMatch(\''+m.id+'\')"><div class="dcard-top"><span class="mr-league">'+(m.num?m.num+' · ':'')+m.league+'</span><span>'+m.time+'</span><span class="dcard-status '+(live?'live':'')+'">'+m.status+'</span></div><div class="dcard-main"><div class="team-col">'+badge(m.home,'lg')+'<span>'+m.home.n+'</span></div><div class="vs '+(live?'live':'')+'">'+(m.score||'VS')+'</div><div class="team-col">'+badge(m.away,'lg')+'<span>'+m.away.n+'</span></div></div><div class="dcard-tags">'+((m.tags&&m.tags.length)?m.tags.map((t,i)=>'<span class="ptag '+(i%2?'blue':'')+'">'+t+'</span>').join(''):'<span class="ptag gray">暂无推单</span>')+'<button class="dcard-btn" onclick="event.stopPropagation();openMatch(\''+m.id+'\')">比赛数据 ›</button></div></div>'}
function leagueBody(){const all=[...(store.matches.football||[]),...(store.matches.basketball||[])];let pool=all;if(state.detail.league){const f=all.filter(m=>m.league===state.detail.league);if(f.length)pool=f}const dk=DATES[state.detail.date].md;let show=pool.filter(m=>!m.date||m.date.slice(5)===dk);let emptyHint=false;if(!show.length){emptyHint=true;show=pool.slice(0,6)}return '<div class="detail-bar"><div class="db-title">'+(state.detail.league||'全部赛事')+'</div><div class="db-sub">资料库 · 共 '+pool.length+' 场</div></div><div class="scroll-x">'+FILTERS.map(f=>'<button class="chip '+(state.detail.filter===f?'on':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</button>').join('')+'</div><div class="scroll-x date-row">'+DATES.map(d=>'<button class="date-chip '+(state.detail.date===d.key?'on':'')+'" onclick="setDate('+d.key+')"><span class="dw">'+d.w+'</span><span class="dm">'+d.md+'</span></button>').join('')+'</div>'+(emptyHint?'<div class="empty" style="margin-top:8px">该日期暂无赛事，以下为其他场次</div>':'')+'<div style="height:4px"></div>'+(show.length?show.map(detailCard).join(''):'<div class="empty">暂无赛事数据</div>')}
function poolUp(o){return o&&o.updateTime?'<div class="pg-up">\u5b98\u65b9\u8d54\u7387 \u00b7 '+o.updateDate+' '+o.updateTime+' \u66f4\u65b0</div>':''}

function renderPoolTab(d,tab){const p=d.pools||{};if(d.isBasket){if(tab==='\u80dc\u8d1f')return poolBoxes([{k:'\u4e3b\u80dc',v:fmtOdds(p.mnl&&p.mnl.h)},{k:'\u5ba2\u80dc',v:fmtOdds(p.mnl&&p.mnl.a)}])+poolUp(p.mnl);if(tab==='\u8ba9\u5206')return '<div class="pg-line">\u8ba9\u5206\u76d8\u53e3<b>'+(p.hdc&&p.hdc.goalLine||'-')+'</b></div>'+poolBoxes([{k:'\u4e3b',v:fmtOdds(p.hdc&&p.hdc.h)},{k:'\u5ba2',v:fmtOdds(p.hdc&&p.hdc.a)}])+poolUp(p.hdc);return '<div class="pg-line">\u5927\u5c0f\u5206<b>'+(p.hilo&&p.hilo.goalLine||'-')+'</b></div>'+poolBoxes([{k:'\u5927\u5206',v:fmtOdds(p.hilo&&p.hilo.h)},{k:'\u5c0f\u5206',v:fmtOdds(p.hilo&&p.hilo.l)}])+poolUp(p.hilo)}if(tab==='\u80dc\u5e73\u8d1f')return poolBoxes([{k:'\u4e3b\u80dc',v:fmtOdds(p.had&&p.had.h)},{k:'\u5e73',v:fmtOdds(p.had&&p.had.d)},{k:'\u5ba2\u80dc',v:fmtOdds(p.had&&p.had.a)}])+poolUp(p.had);if(tab==='\u8ba9\u7403')return '<div class="pg-line">\u8ba9\u7403\u6570<b>'+(p.hhad&&p.hhad.goalLine||'-')+'</b></div>'+poolBoxes([{k:'\u8ba9\u7403\u4e3b\u80dc',v:fmtOdds(p.hhad&&p.hhad.h)},{k:'\u8ba9\u7403\u5e73',v:fmtOdds(p.hhad&&p.hhad.d)},{k:'\u8ba9\u7403\u5ba2\u80dc',v:fmtOdds(p.hhad&&p.hhad.a)}])+poolUp(p.hhad);if(tab==='\u603b\u8fdb\u7403'){const it=[];for(let i=0;i<8;i++)it.push({k:i===7?'7+\u7403':i+'\u7403',v:fmtOdds(p.ttg&&p.ttg['s'+i])});return '<div class="pool-grid g4">'+it.map(o=>'<div class="pg-item"><span>'+o.k+'</span><b>'+o.v+'</b></div>').join('')+'</div>'+poolUp(p.ttg)}if(tab==='\u6bd4\u5206'){const ent=Object.entries(p.crs||{}).filter(x=>/^s\d{2}s\d{2}$/.test(x[0])&&x[1]);ent.sort((a,b)=>a[0].localeCompare(b[0]));return '<div class="pool-grid g4">'+ent.slice(0,36).map(x=>{const h=+x[0].slice(1,3),a=+x[0].slice(4,6);return '<div class="pg-item"><span>'+h+':'+a+'</span><b>'+fmtOdds(x[1])+'</b></div>'}).join('')+'</div>'+(ent.length>36?'<div class="pg-more">\u4ec5\u5c55\u793a\u5e38\u7528\u6bd4\u5206\uff0c\u5168\u91cf\u4ee5\u5b98\u65b9\u9500\u552e\u9875\u4e3a\u51c6</div>':'')+poolUp(p.crs)}const hf=[['hh','\u80dc\u80dc'],['hd','\u80dc\u5e73'],['ha','\u80dc\u8d1f'],['dh','\u5e73\u80dc'],['dd','\u5e73\u5e73'],['da','\u5e73\u8d1f'],['ah','\u8d1f\u80dc'],['ad','\u8d1f\u5e73'],['aa','\u8d1f\u8d1f']];return '<div class="pool-grid g3">'+hf.map(x=>'<div class="pg-item"><span>'+x[1]+'</span><b>'+fmtOdds(p.hafu&&p.hafu[x[0]])+'</b></div>').join('')+'</div>'+poolUp(p.hafu)}


function matchBody(){const m=state.match;if(!m)return '<div class="empty">\u8d5b\u4e8b\u4e0d\u5b58\u5728</div>';const d=state.mdData;const tabs=d&&d.isBasket?['\u80dc\u8d1f','\u8ba9\u5206','\u5927\u5c0f\u5206']:['\u80dc\u5e73\u8d1f','\u8ba9\u7403','\u603b\u8fdb\u7403','\u6bd4\u5206','\u534a\u5168\u573a'];if(!state.mdTab||tabs.indexOf(state.mdTab)<0)state.mdTab=tabs[0];const live=String(m.status).indexOf('\u8fdb\u884c\u4e2d')>-1;const rank=t=>t?'<div class="md-rank">'+t+'</div>':'';const content=aiDetailBlock(m)+(d?('<div class="card">'+renderPoolTab(d,state.mdTab)+'</div>'):'<div class="empty">\u5b98\u65b9\u8d54\u7387\u52a0\u8f7d\u4e2d\u2026</div>');return '<div class="md-head"><div class="md-league">'+(m.num?m.num+' \u00b7 ':'')+m.league+' \u00b7 '+m.date+' '+m.time+' \u00b7 <span>'+m.status+'</span></div><div class="md-vs"><div class="md-team">'+badge(m.home,'lg')+'<span>'+m.home.n+'</span>'+rank(m.home.rank)+'</div><div class="md-score '+(live?'live':'')+'">'+(m.score||'VS')+'</div><div class="md-team">'+badge(m.away,'lg')+'<span>'+m.away.n+'</span>'+rank(m.away.rank)+'</div></div></div><div class="md-tabs">'+tabs.map(t=>'<button class="md-tab '+(state.mdTab===t?'on':'')+'" onclick="setMdTab(\''+t+'\')">'+t+'</button>').join('')+'</div>'+content+'<div class="card"><div class="sec-head"><b>\u5feb\u901f\u9009\u53f7</b><span class="sec-more" onclick="toast(\'\u7ade\u5f69\u73a9\u6cd5\u8bf4\u660e\')">\u73a9\u6cd5\u8bf4\u660e</span></div><div class="mr-odds" style="margin-top:0">'+oddsButtons(m)+'</div><div style="font-size:10px;color:#9aa2ad;text-align:center;margin-top:10px">\u8d54\u7387\u4e0e\u573a\u6b21\u4fe1\u606f\u6765\u81ea\u4e2d\u56fd\u4f53\u80b2\u5f69\u7968\u5b98\u65b9\u63a5\u53e3</div></div>'}
const DRAW_GAME=()=>({'\u80dc\u8d1f\u5f69':CONFIG.GAME_NO.sfc,'\u534a\u5168\u573a':CONFIG.GAME_NO.bqc,'\u8fdb\u7403\u5f69':CONFIG.GAME_NO.jqc});
function renderHist(h){if(!h)return '';if(h.loading&&!h.list.length)return '<div class="hist-empty">加载中…</div>';if(!h.list.length)return '<div class="hist-empty">暂无往期数据</div>';return h.list.map(x=>'<div class="hist-row"><span class="hist-period">'+x.period+'</span><span class="hist-balls">'+x.balls.slice(0,14).map(b=>'<span class="hist-ball">'+b+'</span>').join('')+'</span></div>').join('')+(h.hasMore?'<button class="draw-hist-btn" onclick="loadMoreHist(\''+h.name+'\',\''+h.gameNo+'\')">加载更多</button>':'')}
function drawCard(d){const wide=(d.balls||[]).some(b=>String(b).length>1);const gameNo=DRAW_GAME()[d.name]||'';const h=store.drawHistory[d.name];const open=h&&h.open;return '<div class="draw-card"><div class="draw-head"><span class="draw-name">'+d.name+'</span><span class="draw-period">'+d.period+'</span></div><div class="draw-result">'+((d.balls&&d.balls.length)?d.balls.map(b=>'<span class="ball '+(wide?'wide':'')+'">'+b+'</span>').join(''):'<span class="draw-note">'+(d.note||'')+'</span>')+'</div><div class="draw-actions"><button class="btn-soft" onclick="openTrend(\''+d.name+'\')">走势图</button><button class="btn-soft" onclick="toast(\''+d.name+' · AI 预测生成中…\')">AI预测</button><button class="btn-soft" onclick="toast(\''+d.name+' · 中奖查询\')">中奖查询</button></div>'+(gameNo?'<button class="draw-hist-btn" onclick="toggleDrawHistory(\''+d.name+'\',\''+gameNo+'\')">'+(open?'收起往期开奖':'查看往期开奖')+'</button>'+(open?renderHist(h):''):'')+'</div>'}
function drawBody(){return '<div class="draw-banner"><div><div class="db-t">竞技彩开奖</div><div class="db-s">数据来源：中国体育彩票 · 每日 21:25 更新</div></div><span class="db-tag">今日开奖</span></div>'+(store.draws||[]).map(drawCard).join('')}
async function toggleDrawHistory(name,gameNo){let h=store.drawHistory[name];if(!h)h=store.drawHistory[name]={name,gameNo,list:[],pageNo:0,hasMore:true,loading:false,open:false};h.open=!h.open;h.name=name;h.gameNo=gameNo;if(h.open&&!h.list.length){await loadDrawPage(name,gameNo,1);return}renderBody(true)}
async function loadDrawPage(name,gameNo,pageNo){const h=store.drawHistory[name];if(!h||h.loading||(!h.hasMore&&pageNo>1))return;h.loading=true;renderBody(true);try{if(CONFIG.USE_MOCK)throw new Error('mock');const json=await apiFetch(CONFIG.EP.lottery,{gameNo,provinceId:0,pageSize:10,pageNo,isVerify:1},null);const list=((json&&json.value&&json.value.list)||[]).map(it=>({period:'第'+(it.lotteryDrawNum||'--')+'期',date:String(it.lotteryDrawTime||'').slice(0,10),balls:String(it.lotteryDrawResult||'').split(/[\s,]+/).filter(b=>b&&b!=='+')})).filter(x=>x.balls.length);if(!list.length)h.hasMore=false;else{h.list.push(...list);h.pageNo=pageNo;if(list.length<10)h.hasMore=false}}catch(e){if(pageNo===1){h.list=mockDrawHistory(name);h.hasMore=true;h.pageNo=1}else h.hasMore=false}h.loading=false;renderBody(true)}
function loadMoreHist(name,gameNo){const h=store.drawHistory[name];if(!h)return;loadDrawPage(name,gameNo,(h.pageNo||1)+1)}
function mockDrawHistory(name){const rnd=prng(hashStr(name+'hist'));const cfg={'\u80dc\u8d1f\u5f69':{len:14,pool:['3','1','0']},'\u534a\u5168\u573a':{len:6,pool:['3-1','1-0','0-0','3-3','1-1','0-3','1-3','0-1']},'\u8fdb\u7403\u5f69':{len:6,pool:['0','1','2','3+']}};const c=cfg[name]||cfg['\u80dc\u8d1f\u5f69'];const balls=c.pool?Array.from({length:c.len},()=>c.pool[Math.floor(rnd()*c.pool.length)]):Array.from({length:5},()=>String(1+Math.floor(rnd()*35)).padStart(2,'0')).concat(Array.from({length:2},()=>String(1+Math.floor(rnd()*12)).padStart(2,'0')));return Array.from({length:10},(_,i)=>({period:'\u7b2c'+(26288-i)+'\u671f',date:'',balls}))}
function tvClass(v){const s=String(v);if(s==='3'||s==='3+'||s.indexOf('3')===0)return 'tv-win';if(s==='1'||s.indexOf('1')===0)return 'tv-draw';if(s==='0'||s.indexOf('0')===0)return 'tv-lose';return 'tv-mid'}
function trendStat(list){if(!list.length)return '';const cnt={};let total=0;list.forEach(it=>it.balls.forEach(b=>{cnt[b]=(cnt[b]||0)+1;total++}));const entries=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);if(!entries.length)return '';return entries.map(([k,v])=>'<div class="stat-row"><span class="stat-k">'+k+'</span><span class="stat-bar"><i style="width:'+(v/total*100).toFixed(1)+'%"></i></span><span class="stat-v">'+v+'次 · '+(v/total*100).toFixed(0)+'%</span></div>').join('')}
function trendBody(){const t=state.trend||{name:'胜负彩',list:[],loading:true};const list=t.list||[];const names=['胜负彩','半全场','进球彩'];let main='';if(t.loading&&!list.length){main='<div class="skel-card"><div class="skel skel-line w40"></div><div class="skel skel-line"></div><div class="skel skel-line w80"></div></div>'}else if(!list.length){main='<div class="empty">暂无走势数据</div>'}else{const len=list[0].balls.length;main='<div class="trend-wrap"><div class="trend-scroll"><table class="trend-table"><thead><tr><th class="th-fixed">场次</th>'+list.map(it=>'<th>'+String(it.period).replace('第','').replace('期','')+'</th>').join('')+'</tr></thead><tbody>'+Array.from({length:len},(_,i)=>'<tr><td class="td-fixed">第'+(i+1)+'场</td>'+list.map(it=>{const v=it.balls[i]!=null?it.balls[i]:'-';return '<td><span class="tv '+tvClass(v)+'">'+v+'</span></td>'}).join('')+'</tr>').join('')+'</tbody></table></div></div><div class="card"><div class="sec-head"><b>号码分布</b><span class="sec-more">近 '+list.length+' 期</span></div>'+trendStat(list)+'</div>'}return '<div class="scroll-x">'+names.map(n=>'<button class="chip '+(t.name===n?'on':'')+'" onclick="setTrend(\''+n+'\')">'+n+'</button>').join('')+'</div>'+main}
function openTrend(name){const gameNo=DRAW_GAME()[name]||'';state.trend={name,gameNo,list:[],loading:true};state.page='trend';render();loadTrendData(name,gameNo)}
async function loadTrendData(name,gameNo){const t=state.trend;t.list=mockDrawHistory(name);t.loading=false;renderBody(true);if(CONFIG.USE_MOCK||!gameNo)return;try{const json=await apiFetch(CONFIG.EP.lottery,{gameNo,provinceId:0,pageSize:12,pageNo:1,isVerify:1},'trend:'+gameNo);const list=((json&&json.value&&json.value.list)||[]).map(it=>({period:'第'+(it.lotteryDrawNum||'--')+'期',balls:String(it.lotteryDrawResult||'').split(/[\s,]+/).filter(b=>b&&b!=='+')})).filter(x=>x.balls.length);if(list.length&&state.page==='trend'&&state.trend.name===name){state.trend.list=list;renderBody(true)}}catch(e){}}
function setTrend(name){state.trend={name,gameNo:DRAW_GAME()[name]||'',list:[],loading:true};renderBody(true);loadTrendData(name,state.trend.gameNo)}
function totalStake(){return store.betLog.reduce((s,r)=>s+(r.stake||0),0).toFixed(2)}
function totalWin(){return store.betLog.reduce((s,r)=>s+(r.winAmount||0),0).toFixed(2)}
function recordCard(r){const open=!!state.expanded[r.id];const statusMap={pending:['待开奖','st-pending'],won:['已中奖','st-won'],lost:['未中奖','st-lost']};const[txt,cls]=statusMap[r.status]||statusMap.pending;return '<div class="rec-card" onclick="toggleRecord(\''+r.id+'\')"><div class="rec-top"><span class="rec-type">'+(r.type==='parlay'?r.count+'串1':'单关')+' · '+r.count+'场</span><span class="rec-status '+cls+'">'+txt+'</span></div><div>'+r.items.slice(0,3).map(it=>'<div class="rec-item"><span class="rec-name">'+it.label+'</span><span class="rec-pick">'+it.pick+' '+Number(it.odds).toFixed(2)+'</span></div>').join('')+(r.items.length>3?'<div class="rec-more">还有 '+(r.items.length-3)+' 场…</div>':'')+'</div><div class="rec-bottom"><span>'+fmtDate(r.time)+' · '+r.multiple+'倍</span><span class="rec-money">投注 ¥'+r.stake.toFixed(2)+(r.status==='won'?' · 中奖 <b>¥'+r.winAmount.toFixed(2)+'</b>':'')+'</span></div>'+(open?'<div class="rec-detail">'+r.items.map(it=>'<div class="rec-drow"><span class="rec-dm">'+it.league+' · '+it.time+'</span><span class="rec-dn">'+it.label+'</span><span class="rec-dp">'+it.pick+'</span><span class="rec-do">'+Number(it.odds).toFixed(2)+'</span></div>').join('')+(r.status==='pending'?'<div class="rec-tip">模拟结算将在 3 秒后生效，重新进入本页即可查看结果</div>':'<div class="rec-tip">'+(r.status==='won'?'理论最高奖金 ¥'+r.payout.toFixed(2)+' · 本单模拟命中':'本单模拟未命中，投注金额已扣除')+'</div>')+'<button class="rec-del" onclick="event.stopPropagation();deleteRecord(\''+r.id+'\')">删除此记录</button></div>':'')+'</div>'}
function recordsBody(){settleAllPending();const list=store.betLog;if(!list.length)return '<div class="empty">还没有投注记录<br>选择比赛并确保赔率后即可模拟投注</div>';return '<div class="rec-summary"><div class="rs-col"><div class="rs-label">累计投注</div><div class="rs-num">¥'+totalStake()+'</div></div><div class="rs-col right"><div class="rs-label">模拟中奖</div><div class="rs-num">¥'+totalWin()+'</div></div></div><div class="rs-tip">本地模拟记录，不会产生真实交易。点按卡片可展开场次明细。</div>'+list.map(recordCard).join('')+'<div style="padding:2px 12px 12px"><button class="btn-soft" style="width:100%" onclick="clearBetLog()">清空投注记录</button></div>'}
function toggleRecord(id){state.expanded[id]=!state.expanded[id];renderBody(true)}
function deleteRecord(id){store.betLog=store.betLog.filter(r=>r.id!==id);saveBetLog();renderBody(true);toast('已删除该记录')}
function clearBetLog(){if(!store.betLog.length){toast('暂无记录');return}store.betLog=[];saveBetLog();renderBody(true);toast('已清空投注记录')}
function rechargeBody(){const presets=[10,30,68,128,328,648];const amount=state.pay.amount||0;return '<div class="pay-banner"><div class="pb-label">账户余额</div><div class="pb-num">'+money2(store.wallet.balance)+'</div><div class="pb-hint">充值为模拟行为，不会产生真实交易</div></div><div class="card"><div class="sec-head"><b>选择充值金额</b><span class="sec-more" onclick="openWalletRecords()">资金明细 ›</span></div><div class="amount-grid">'+presets.map(v=>'<button class="amount-btn '+(amount===v?'on':'')+'" onclick="selectAmount('+v+')">¥'+v+'</button>').join('')+'</div><div class="custom-amount"><span class="cur">¥</span><input id="customAmount" type="tel" inputmode="numeric" placeholder="自定义金额（1-10000）" value="'+(presets.includes(amount)?'':(amount||''))+'"><button class="code-btn" onclick="selectCustomAmount()">确定</button></div></div><div class="card"><div class="sec-head"><b>支付方式</b></div>'+Object.entries(PAY_METHODS).map(([k,v])=>'<div class="pay-method '+(state.pay.method===k?'on':'')+'" onclick="selectPayMethod(\''+k+'\')"><span class="pay-logo '+k+'" style="background:'+v.bg+'">'+v.logo+'</span><div class="pm-name">'+v.name+'<div class="pm-desc">'+v.desc+'</div></div><span class="pm-radio"></span></div>').join('')+'</div><div style="margin:0 12px"><button class="pay-btn" onclick="openPaySheet()" '+(amount?'':'disabled')+'>立即充值 '+(amount?money2(amount):'')+'</button><div style="font-size:10px;color:#9aa2ad;text-align:center;line-height:1.7;padding:12px 0 4px">本页为支付流程演示，充值金额仅记录在本机</div></div>'}
function walletRecordsBody(){const list=store.wallet.records;if(!list.length)return '<div class="empty">暂无资金明细</div>';return '<div class="rec-summary"><div class="rs-col"><div class="rs-label">账户余额</div><div class="rs-num">'+money2(store.wallet.balance)+'</div></div><div class="rs-col right"><div class="rs-label">记录数</div><div class="rs-num">'+list.length+'</div></div></div><div class="card">'+list.map(r=>{const isIn=r.amount>0;return '<div class="wallet-row"><div class="wr-info"><div class="wr-name">'+r.desc+'</div><div class="wr-time">'+fmtDate(r.time)+'</div></div><div class="wr-amount '+(isIn?'in':'out')+'">'+(isIn?'+':'')+r.amount.toFixed(2)+'</div></div>'}).join('')+'</div>'}
function openWalletRecords(){state.page='walletRecords';render()}
function mineBody(){const auth=store.auth;const balance=store.wallet.balance;const menus=[{i:'📋',n:'我的投注记录',a:'openRecords()'},{i:'💳',n:'资金明细',a:'openWalletRecords()'},{i:'🏆',n:'中奖记录',a:"toast('打开中奖记录')"},{i:'📊',n:'数据中心',a:"toast('打开数据中心')"},{i:'⚙️',n:'设置与安全',a:"toast('打开设置')"}];return '<div class="profile"><div class="avatar">'+(auth?'彩':'未')+'</div><div><div class="pname">'+(auth?auth.nickname:'未登录')+'<span class="pvip" style="background:linear-gradient(135deg,#ffe9a8,#f5c518);color:#8a5a1a;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;margin-left:6px">V3</span></div><div class="pdesc">'+(auth?auth.phone.replace(/(\d{3})\d{4}(\d{4})/,'$1****$2'):'登录后可使用完整功能')+'</div></div>'+(auth?'<button class="dcard-btn" style="margin-left:auto" onclick="logout()">退出</button>':'<button class="dcard-btn" style="margin-left:auto" onclick="showLogin()">登录</button>')+'</div><div class="balance-card"><div class="bc-label">账户余额（模拟）</div><div class="bc-num">'+money2(balance)+'</div><div class="bc-actions"><button class="bc-btn primary" onclick="openRecharge()">充值</button><button class="bc-btn" onclick="openWalletRecords()">明细</button></div></div><div class="card">'+menus.map(m=>'<div class="menu-row" onclick="'+m.a+'"><span class="mi">'+m.i+'</span><span>'+m.n+'</span><span class="arrow">›</span></div>').join('')+'</div><div style="text-align:center;font-size:10px;color:#9aa2ad;padding:8px 0 16px;line-height:1.7">竞彩助手 · 模拟演示版<br>不提供真实投注 · 请理性参与</div>'}
function skeletonBody(){return '<div class="skel-card"><div class="skel skel-line w40"></div><div class="skel skel-line"></div><div class="skel skel-line w80"></div></div><div class="skel-card"><div class="skel skel-line w60"></div><div class="skel skel-line w80"></div><div class="skel skel-line w40"></div></div>'}
function renderBody(keepScroll){const el=document.getElementById('appBody');const top=keepScroll?el.scrollTop:0;let html='';if(store.loading&&!store.lastUpdate)html=skeletonBody();else if(state.page==='match')html=matchBody();else if(state.page==='league')html=leagueBody();else if(state.page==='records')html=recordsBody();else if(state.page==='trend')html=trendBody();else if(state.page==='recharge')html=rechargeBody();else if(state.page==='walletRecords')html=walletRecordsBody();else if(state.tab==='home')html=homeBody();else if(state.tab==='scores')html=scoresBody();else if(state.tab==='draw')html=drawBody();else html=mineBody();el.innerHTML=html;el.scrollTop=top}
function renderPreserveScroll(){const el=document.getElementById('appBody');const top=el?el.scrollTop:0;renderHeader();renderBody(true);renderTabbar();renderBetBar();if(el)el.scrollTop=top}
const ICONS={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9.5 21v-6h5v6"/></svg>',scores:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7.6 14.9 10 13.7 13.4h-3.4L9.1 10z" stroke-linejoin="round"/></svg>',draw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',mine:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.4-3.6 4.2-5.4 7.5-5.4s6.1 1.8 7.5 5.4"/></svg>'};
function activeTabKey(){if(state.page==='main')return state.tab;if(state.page==='records'||state.page==='walletRecords')return 'mine';if(state.page==='recharge')return 'mine';if(state.page==='trend')return 'draw';return state.returnTab}
function renderTabbar(){const el=document.getElementById('tabbar');const active=activeTabKey();const item=(key,label,icon)=>'<button class="tab '+(active===key?'on':'')+'" onclick="switchTab(\''+key+'\')"><span class="ico">'+icon+'</span><span>'+label+'</span></button>';el.innerHTML=item('home','首页',ICONS.home)+item('scores','比分',ICONS.scores)+'<div class="tab-mid"><button class="fab" onclick="openSheet()">选号</button><span class="tab-label">选号</span></div>'+item('draw','开奖',ICONS.draw)+item('mine','我的',ICONS.mine)}
function render(){renderHeader();renderStatus();renderBody();renderTabbar();renderBetBar()}
function switchTab(tab){state.tab=tab;state.page='main';render();if(!CONFIG.USE_MOCK&&Date.now()-store.lastUpdate>20000)bootstrap(false)}
function tapHomeNav(i){state.homeNav=i;renderHeader();toast('切换到「'+DATA.homeNav[i]+'」')}
function setSport(sport){if(state.sport===sport)return;state.sport=sport;state.hotLeague='';render();toast('\u5df2\u5207\u6362\uff1a'+(sport==='football'?'\u8db3\u7403':'\u7bee\u7403'))}
function setHotLeague(l){state.hotLeague=(l==='\u5168\u90e8'||state.hotLeague===l)?'':l;renderBody(true);toast(state.hotLeague?('\u8054\u8d5b\u7b5b\u9009\uff1a'+state.hotLeague):'\u5df2\u663e\u793a\u5168\u90e8\u5728\u552e\u8d5b\u4e8b')}
function setRegion(r){state.region=r;renderBody(true);toast('地区：'+r)}
function setFilter(f){state.detail.filter=f;renderBody(true);toast('竞彩筛选：'+f)}
function setDate(k){state.detail.date=k;renderBody(true);toast('日期：'+DATES[k].w+' '+DATES[k].md)}
function setMdTab(t){state.mdTab=t;renderBody(true)}
function openRecords(){if(!store.auth){toast('请先登录');showLogin();return}state.returnTab=state.tab==='main'?'mine':state.returnTab;state.page='records';settleAllPending();render()}
function openLeague(league){state.returnTab=state.tab==='main'?'scores':state.tab;state.detail.league=league;state.detail.date=0;state.page='league';render();toast('进入 '+league+' 赛事详情')}
function openMatch(id){const m=findMatch(id);if(!m){toast('赛事不存在');return}state.prevPage=state.page;state.prevTab=state.tab;if(state.page==='main')state.returnTab=state.tab;state.match=m;state.mdTab='';state.mdData=null;state.page='match';render();loadMatchDetail(m)}
function goBack(){if(state.page==='match'){state.page=state.prevPage||'main';if(state.page==='main')state.tab=state.prevTab||'scores'}else if(state.page==='records'||state.page==='walletRecords'||state.page==='recharge'){state.page='main';state.tab='mine'}else if(state.page==='trend'){state.page='main';state.tab='draw'}else{state.page='main';state.tab=state.returnTab||'scores'}render()}
(function initPull(){const el=document.getElementById('appBody');let startY=0,pulling=false,dist=0;el.addEventListener('touchstart',e=>{if(el.scrollTop>0)return;startY=e.touches[0].clientY;pulling=true;dist=0},{passive:true});el.addEventListener('touchmove',e=>{if(!pulling)return;dist=e.touches[0].clientY-startY},{passive:true});el.addEventListener('touchend',()=>{if(pulling&&dist>62&&el.scrollTop===0){manualRefresh()}pulling=false;dist=0})})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('[SW] 注册失败',e))})}
state.hotLeague='';
store.betLog=loadBetLog();
store.wallet=loadWallet();
store.auth=loadAuth();
const hadCache=restoreCache();
if(hadCache)store.source='partial';
render();
if(!store.auth){document.getElementById('loginScreen').classList.add('show')}
bootstrap(false);
scheduleRefresh();
</script>
</body>
</html>
